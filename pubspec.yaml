name: mepto_clone
description: A Zepto clone app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  uuid: ^4.5.1
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.11.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.1.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  razorpay_flutter: ^1.3.6
  image_picker: ^1.2.3
  go_router: ^17.3.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  flutter_local_notifications: ^21.0.0
  open_filex: ^4.7.0
  media_store_plus: ^0.1.3
  flutter_map: 7.0.2
  latlong2: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
