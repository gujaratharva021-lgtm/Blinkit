    - assets/images/wishlist_intro/
    - assets/images/products/
    - assets/events/
    - assets/images/banners/  
    - assets/mock/addresses.json
    - assets/mock/gst_details.json
    - assets/mock/gift_cards.json
    - assets/images/
    - assets/images/Fruits/
    - assets/images/Chocolate/
    - assets/images/Beverages/
    - assets/images/Ice Creams/
    - assets/images/Bakery/
    - assets/images/Biscuits/
    - assets/images/Namkeen/
    - assets/images/Wafers/
    - assets/images/ketchup/
    - assets/images/shampoo/
    - assets/images/Soap/
    - assets/images/splash/
    - assets/images/onboarding/
    - assets/images/personal use items/
    - assets/images/pickel/
    - assets/images/puja items/
    - assets/images/toys items/
    - assets/images/cloths items/
    - assets/categories/
    
    - assets/data/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

