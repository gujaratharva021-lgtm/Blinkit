name: mepto_clone
description: A Zepto clone app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  uuid: ^4.5.1
  flutter:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.11.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  razorpay_flutter: ^1.3.6
  image_picker: ^1.2.3
  go_router: ^17.3.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/auth/login_hero.png
    - assets/images/products/
    - assets/events/
    - assets/images/banners/  
    - assets/mock/addresses.json
    - assets/mock/gst_details.json
    - assets/mock/gift_cards.json
    - assets/images/
    - assets/images/Fruits/
    - assets/images/Chocolate/
    - assets/images/Beverages/
    - assets/images/Ice Creams/
    - assets/images/Bakery/
    - assets/images/Biscuits/
    - assets/images/Namkeen/
    - assets/images/Wafers/
    - assets/images/ketchup/
    - assets/images/shampoo/
    - assets/images/Soap/
    - assets/images/splash/
    - assets/images/personal use items/
    - assets/images/pickel/
    - assets/images/puja items/
    - assets/images/toys items/
    - assets/images/cloths items/
    - assets/categories/
    
    - assets/data/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

